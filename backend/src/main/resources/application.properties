spring.application.name=CoWorkSpace-Backend

# ------------------------------------------------------------------------------
# SERVIDOR WEB (Puerto 8083 para evitar colisiones locales, o ${PORT} en Cloud Run)
# ------------------------------------------------------------------------------
server.port=${PORT:8083}

# ------------------------------------------------------------------------------
# CONEXIÓN A POSTGRESQL 16 (Local Docker o Aiven Cloud)
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cowork_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# JPA / HIBERNATE
# 'validate' es innegociable frente al GiST de PostgreSQL
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Madrid

# ------------------------------------------------------------------------------
# SUBIDA DE ARCHIVOS (Imágenes Cloudinary / Archivos QR)
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ------------------------------------------------------------------------------
# PARÁMETROS JWT (Configurados por variables de entorno)
# ------------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:clave_local_desarrollo_temporal_calatrava_2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
